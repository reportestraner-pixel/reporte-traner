<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporte TRANER</title>
<meta name="theme-color" content="#5f6160">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reporte TRANER">
<style>
  html,body{margin:0;height:100%;background:#ffffff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #off{display:none;position:fixed;inset:0;place-items:center;text-align:center;
       font:16px system-ui,sans-serif;color:#333;padding:24px}
  body.offline #off{display:grid} body.offline iframe{display:none}
</style>
</head>
<body>
<!-- Pegue aquí el enlace /exec de su Apps Script -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbydNB9g-fxotnWlqGDrv9KmMu-nXSHbk6Z3u7lX59ZFFTslHkw4IJNhfrC_NiCzSnQfAg/exec"
        title="Reporte Diario de Terreno" allow="clipboard-write"></iframe>
<div id="off"><div><b>Sin conexión a internet</b><br>Conéctese y vuelva a abrir la app para llenar y enviar el reporte.</div></div>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  const net = () => document.body.classList.toggle('offline', !navigator.onLine);
  addEventListener('online', () => { net(); document.getElementById('app').src = document.getElementById('app').src; });
  addEventListener('offline', net); net();
</script>
</body>
</html>
